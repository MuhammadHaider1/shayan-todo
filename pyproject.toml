[project]
name = "shayan-todo"
version = "0.1.0"
description = "Todo list app with a FastAPI backend, agent-built via a Linear -> CI -> review -> auto-merge loop."
readme = "README.md"
authors = [
    { name = "Muhammed Haider", email = "muhammedhaider914@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "mcp_server", "tests", "scripts"]
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]